<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Financial Help Hub</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        /* Login Page */
        .login-container {
            max-width: 400px;
            margin: 100px auto;
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .login-header h1 {
            color: #667eea;
            font-size: 28px;
            margin-bottom: 10px;
        }
        
        .login-header p {
            color: #666;
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .btn-login {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .btn-login:hover {
            transform: translateY(-2px);
        }
        
        .error-message {
            background: #fee;
            color: #c33;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
            font-size: 14px;
            text-align: center;
        }
        
        /* Dashboard */
        .dashboard {
            display: none;
        }
        
        .dashboard-header {
            background: white;
            padding: 20px 30px;
            border-radius: 10px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .dashboard-header h1 {
            color: #667eea;
            font-size: 28px;
        }
        
        .dashboard-header p {
            color: #666;
            font-size: 14px;
        }
        
        .btn-logout {
            padding: 10px 20px;
            background: #ff4757;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
        }
        
        .btn-logout:hover {
            background: #ee5a6f;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .stat-card h3 {
            color: #666;
            font-size: 14px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }
        
        .stat-card .stat-value {
            font-size: 36px;
            font-weight: bold;
            color: #667eea;
        }
        
        .requests-container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .requests-container h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 24px;
        }
        
        .filter-buttons {
            margin-bottom: 20px;
        }
        
        .filter-btn {
            padding: 8px 16px;
            margin-right: 10px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
        }
        
        .filter-btn.active {
            background: #667eea;
            color: white;
        }
        
        .requests-table {
            width: 100%;
            border-collapse: collapse;
        }
        
        .requests-table th {
            background: #f8f9fa;
            padding: 15px;
            text-align: left;
            font-weight: 600;
            color: #333;
            border-bottom: 2px solid #e0e0e0;
        }
        
        .requests-table td {
            padding: 15px;
            border-bottom: 1px solid #e0e0e0;
            color: #555;
        }
        
        .requests-table tr:hover {
            background: #f8f9fa;
        }
        
        .status-badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }
        
        .status-pending {
            background: #fff3cd;
            color: #856404;
        }
        
        .status-approved {
            background: #d4edda;
            color: #155724;
        }
        
        .status-rejected {
            background: #f8d7da;
            color: #721c24;
        }
        
        .action-buttons {
            display: flex;
            gap: 10px;
        }
        
        .btn-approve {
            padding: 8px 16px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
        }
        
        .btn-approve:hover {
            background: #218838;
        }
        
        .btn-reject {
            padding: 8px 16px;
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
        }
        
        .btn-reject:hover {
            background: #c82333;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        
        .no-requests {
            text-align: center;
            padding: 40px;
            color: #999;
        }
    </style>
</head>
<body>
    <!-- Login Page -->
    <div class="login-container" id="loginPage">
        <div class="login-header">
            <h1>🔒 Admin Login</h1>
            <p>Financial Help Hub Administration</p>
        </div>
        
        <div id="loginError"></div>
        
        <form onsubmit="adminLogin(event)">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="adminUsername" placeholder="Enter admin username" required>
            </div>
            
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="adminPassword" placeholder="Enter password" required>
            </div>
            
            <button type="submit" class="btn-login">Login</button>
        </form>
    </div>
    
    <!-- Dashboard -->
    <div class="dashboard" id="dashboardPage">
        <div class="container">
            <div class="dashboard-header">
                <div>
                    <h1>📊 Admin Dashboard</h1>
                    <p>Manage help requests and approvals</p>
                </div>
                <button class="btn-logout" onclick="adminLogout()">Logout</button>
            </div>
            
            <div class="stats-grid" id="statsGrid">
                <div class="stat-card">
                    <h3>Total Requests</h3>
                    <div class="stat-value" id="totalRequests">0</div>
                </div>
                <div class="stat-card">
                    <h3>Pending</h3>
                    <div class="stat-value" id="pendingRequests">0</div>
                </div>
                <div class="stat-card">
                    <h3>Approved</h3>
                    <div class="stat-value" id="approvedRequests">0</div>
                </div>
                <div class="stat-card">
                    <h3>Rejected</h3>
                    <div class="stat-value" id="rejectedRequests">0</div>
                </div>
            </div>
            
            <div class="requests-container">
                <h2>Help Requests</h2>
                
                <div class="filter-buttons">
                    <button class="filter-btn active" onclick="filterRequests('all')">All</button>
                    <button class="filter-btn" onclick="filterRequests('pending')">Pending</button>
                    <button class="filter-btn" onclick="filterRequests('approved')">Approved</button>
                    <button class="filter-btn" onclick="filterRequests('rejected')">Rejected</button>
                </div>
                
                <div id="requestsContent">
                    <div class="loading">Loading requests...</div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        let allRequests = [];
        let currentFilter = 'all';
        
        // Check if admin is already logged in
        async function checkAdminSession() {
            try {
                const response = await fetch('/api/admin/pending-requests', {
                    credentials: 'include'
                });
                
                if (response.ok) {
                    showDashboard();
                    loadRequests();
                }
            } catch (error) {
                console.log('Not logged in');
            }
        }
        
        // Admin login
        async function adminLogin(e) {
            e.preventDefault();
            
            const username = document.getElementById('adminUsername').value;
            const password = document.getElementById('adminPassword').value;
            
            try {
                const response = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    credentials: 'include',
                    body: JSON.stringify({username, password})
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showDashboard();
                    loadRequests();
                } else {
                    document.getElementById('loginError').innerHTML = '<div class="error-message">' + (data.error || 'Login failed') + '</div>';
                }
            } catch (error) {
                document.getElementById('loginError').innerHTML = '<div class="error-message">Login failed. Please try again.</div>';
            }
        }
        
        // Admin logout
        async function adminLogout() {
            try {
                await fetch('/api/admin/logout', {
                    method: 'POST',
                    credentials: 'include'
                });
                
                document.getElementById('loginPage').style.display = 'block';
                document.getElementById('dashboardPage').style.display = 'none';
            } catch (error) {
                console.error('Logout failed:', error);
            }
        }
        
        // Show dashboard
        function showDashboard() {
            document.getElementById('loginPage').style.display = 'none';
            document.getElementById('dashboardPage').style.display = 'block';
        }
        
        // Load all requests
        async function loadRequests() {
            try {
                const response = await fetch('/api/admin/pending-requests', {
                    credentials: 'include'
                });
                
                if (!response.ok) {
                    throw new Error('Failed to load requests');
                }
                
                allRequests = await response.json();
                updateStats();
                renderRequests();
            } catch (error) {
                document.getElementById('requestsContent').innerHTML = '<div class="no-requests">Failed to load requests</div>';
            }
        }
        
        // Update statistics
        function updateStats() {
            const total = allRequests.length;
            const pending = allRequests.filter(r => r.approval_status === 'pending').length;
            const approved = allRequests.filter(r => r.approval_status === 'approved').length;
            const rejected = allRequests.filter(r => r.approval_status === 'rejected').length;
            
            document.getElementById('totalRequests').textContent = total;
            document.getElementById('pendingRequests').textContent = pending;
            document.getElementById('approvedRequests').textContent = approved;
            document.getElementById('rejectedRequests').textContent = rejected;
        }
        
        // Filter requests
        function filterRequests(filter) {
            currentFilter = filter;
            
            // Update active button
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            renderRequests();
        }
        
        // Render requests table
        function renderRequests() {
            let filtered = allRequests;
            
            if (currentFilter !== 'all') {
                filtered = allRequests.filter(r => r.approval_status === currentFilter);
            }
            
            if (filtered.length === 0) {
                document.getElementById('requestsContent').innerHTML = '<div class="no-requests">No requests found</div>';
                return;
            }
            
            let html = `
                <table class="requests-table">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Amount Needed</th>
                            <th>District</th>
                            <th>Category</th>
                            <th>Status</th>
                            <th>Description</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
            `;
            
            filtered.forEach(request => {
                const districtName = request.districts ? request.districts.name : 'N/A';
                const categoryName = request.categories ? request.categories.name : 'N/A';
                const statusClass = 'status-' + request.approval_status;
                
                html += `
                    <tr>
                        <td>${request.name || 'N/A'}</td>
                        <td>₹${(request.amount_needed || 0).toLocaleString()}</td>
                        <td>${districtName}</td>
                        <td>${categoryName}</td>
                        <td><span class="status-badge ${statusClass}">${request.approval_status}</span></td>
                        <td>${request.short_description || request.description || 'No description'}</td>
                        <td>
                `;
                
                if (request.approval_status === 'pending') {
                    html += `
                        <div class="action-buttons">
                            <button class="btn-approve" onclick="approveRequest('${request.id}')">✓ Approve</button>
                            <button class="btn-reject" onclick="rejectRequest('${request.id}')">✗ Reject</button>
                        </div>
                    `;
                } else {
                    html += '<span style="color: #999;">No actions</span>';
                }
                
                html += `
                        </td>
                    </tr>
                `;
            });
            
            html += `
                    </tbody>
                </table>
            `;
            
            document.getElementById('requestsContent').innerHTML = html;
        }
        
        // Approve request
        async function approveRequest(requestId) {
            if (!confirm('Are you sure you want to approve this request?')) return;
            
            try {
                const response = await fetch(`/api/admin/approve-request/${requestId}`, {
                    method: 'POST',
                    credentials: 'include'
                });
                
                const data = await response.json();
                
                if (data.success) {
                    alert('Request approved successfully!');
                    loadRequests();
                } else {
                    alert('Failed to approve: ' + (data.error || 'Unknown error'));
                }
            } catch (error) {
                alert('Failed to approve request');
            }
        }
        
        // Reject request
        async function rejectRequest(requestId) {
            const reason = prompt('Enter rejection reason:');
            if (!reason) return;
            
            try {
                const response = await fetch(`/api/admin/reject-request/${requestId}`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    credentials: 'include',
                    body: JSON.stringify({reason})
                });
                
                const data = await response.json();
                
                if (data.success) {
                    alert('Request rejected');
                    loadRequests();
                } else {
                    alert('Failed to reject: ' + (data.error || 'Unknown error'));
                }
            } catch (error) {
                alert('Failed to reject request');
            }
        }
        
        // Check session on page load
        checkAdminSession();
    </script>
</body>
</html>
